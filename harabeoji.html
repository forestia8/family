<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>행복 복권 당첨 결과 - 할아버지</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', '맑은 고딕', sans-serif;
      background: #f0f4f8;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      padding: 24px 16px 60px;
    }

    .ticket {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.13);
    }

    .ticket-header {
      background: #4a90d9;
      color: #fff;
      text-align: center;
      padding: 14px 16px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .ticket-body {
      padding: 24px 20px 20px;
    }

    .lotto-round {
      text-align: center;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 16px;
      color: #222;
    }

    .lotto-round span {
      color: #4a90d9;
    }

    .winning-label {
      text-align: center;
      font-size: 14px;
      color: #555;
      margin-bottom: 10px;
    }

    .winning-numbers {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }

    .ball {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      flex-shrink: 0;
    }

    .ball-red { background: #e05c5c; }
    .ball-yellow { background: #f5c842; color: #333; }
    .ball-gray { background: #9e9e9e; }

    .plus-sign {
      font-size: 18px;
      color: #555;
      font-weight: 600;
    }

    .congrats-section {
      text-align: center;
      margin-bottom: 24px;
    }

    .congrats-sub {
      font-size: 14px;
      color: #555;
      margin-bottom: 4px;
    }

    .congrats-main {
      font-size: 24px;
      font-weight: 800;
      color: #111;
    }

    .result-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      border: 1px solid #dde3ea;
      border-radius: 8px;
      overflow: hidden;
    }

    .result-table tr {
      border-bottom: 1px solid #dde3ea;
    }

    .result-table tr:last-child {
      border-bottom: none;
    }

    .result-table tr:nth-child(even) {
      background: #f7f9fb;
    }

    .result-table td {
      padding: 10px 8px;
      vertical-align: middle;
    }

    .row-label {
      font-size: 13px;
      color: #888;
      width: 24px;
      text-align: center;
      font-weight: 600;
    }

    .row-status {
      font-size: 13px;
      width: 42px;
      text-align: center;
      font-weight: 600;
    }

    .row-status.win { color: #e05c5c; }
    .row-status.lose { color: #999; }

    .row-balls {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
    }

    .row-balls .ball {
      width: 36px;
      height: 36px;
      font-size: 13px;
    }

    .heart-ball {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #9e9e9e;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .heart-ball svg { width: 16px; height: 16px; }

    .ticket-footer {
      background: #f0f4f8;
      border-top: 1px solid #dde3ea;
      padding: 14px 20px;
      font-size: 12px;
      color: #666;
      line-height: 1.8;
      text-align: left;
    }

    /* QR Section */
    .qr-section {
      margin-top: 28px;
      text-align: center;
    }

    .qr-section h3 {
      font-size: 15px;
      font-weight: 700;
      color: #333;
      margin-bottom: 4px;
    }

    .qr-section p {
      font-size: 12px;
      color: #888;
      margin-bottom: 12px;
    }

    #qrcode-grandpa {
      display: inline-block;
      background: #fff;
      padding: 12px;
      border-radius: 10px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
    }

    #qrcode-grandpa canvas,
    #qrcode-grandpa img {
      display: block;
    }
  </style>
</head>
<body>

  <div class="ticket">
    <div class="ticket-header">행복 복권 당첨 결과</div>
    <div class="ticket-body">

      <div class="lotto-round">로또 6/45 <span>제1314회</span></div>
      <div class="winning-label">당첨번호</div>

      <div class="winning-numbers">
        <div class="ball ball-red">기</div>
        <div class="ball ball-red">적</div>
        <div class="ball ball-red">이</div>
        <div class="ball ball-red">왔</div>
        <div class="ball ball-red">어</div>
        <div class="ball ball-red">요</div>
        <div class="plus-sign">+</div>
        <div class="ball ball-yellow">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="#c0392b">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </div>
      </div>

      <div class="congrats-section">
        <div class="congrats-sub">축하합니다!</div>
        <div class="congrats-main">
          <span style="display:inline-block;vertical-align:middle;margin-right:4px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#c0392b">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </span>할아버지 당첨<span style="display:inline-block;vertical-align:middle;margin-left:4px;">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="#c0392b">
              <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
          </span>
        </div>
      </div>

      <table class="result-table">
        <tbody>
          <tr>
            <td class="row-label">A</td>
            <td class="row-status lose">낙첨</td>
            <td>
              <div class="row-balls">
                <div class="ball ball-gray">깜</div>
                <div class="ball ball-gray">짝</div>
                <div class="ball ball-gray">놀</div>
                <div class="ball ball-gray">라</div>
                <div class="ball ball-gray">셨</div>
                <div class="ball ball-gray">죠</div>
              </div>
            </td>
          </tr>
          <tr>
            <td class="row-label">B</td>
            <td class="row-status lose">낙첨</td>
            <td>
              <div class="row-balls">
                <div class="ball ball-gray">저</div>
                <div class="ball ball-gray">희</div>
                <div class="ball ball-gray">에</div>
                <div class="ball ball-gray">게</div>
                <div class="ball ball-gray">벅</div>
                <div class="ball ball-gray">찬</div>
              </div>
            </td>
          </tr>
          <tr>
            <td class="row-label">C</td>
            <td class="row-status win">당첨</td>
            <td>
              <div class="row-balls">
                <div class="ball ball-red">기</div>
                <div class="ball ball-red">적</div>
                <div class="ball ball-red">이</div>
                <div class="ball ball-red">왔</div>
                <div class="ball ball-red">어</div>
                <div class="ball ball-red">요</div>
              </div>
            </td>
          </tr>
          <tr>
            <td class="row-label">D</td>
            <td class="row-status lose">낙첨</td>
            <td>
              <div class="row-balls">
                <div class="ball ball-gray">할</div>
                <div class="ball ball-gray">부</div>
                <div class="ball ball-gray">지</div>
                <div class="ball ball-gray">되</div>
                <div class="ball ball-gray">신</div>
                <div class="ball ball-gray">거</div>
              </div>
            </td>
          </tr>
          <tr>
            <td class="row-label">E</td>
            <td class="row-status lose">낙첨</td>
            <td>
              <div class="row-balls">
                <div class="ball ball-gray">축</div>
                <div class="ball ball-gray">하</div>
                <div class="ball ball-gray">드</div>
                <div class="ball ball-gray">려</div>
                <div class="ball ball-gray">요</div>
                <div class="heart-ball">
                  <svg viewBox="0 0 24 24" fill="#fff">
                    <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
                  </svg>
                </div>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

    </div>
    <div class="ticket-footer">
      QR 당첨 확인은 보조 확인 수단이므로 반드시 손주의 실물과 대조하시기 바랍니다.<br>
      세상에서 가장 큰 행운, 할아버지가 된 당신에게 지급됩니다.
    </div>
  </div>

  <!-- QR Code Section -->
  <div class="qr-section">
    <h3>QR 코드</h3>
    <p>이 QR을 스캔하면 할아버지 당첨 페이지로 이동합니다</p>
    <div id="qrcode-grandpa"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script>
    // TODO: 실제 호스팅 후 아래 URL을 실제 주소로 교체하세요
    var pageUrl = window.location.href || "https://your-site.com/harabeoji";

    new QRCode(document.getElementById("qrcode-grandpa"), {
      text: pageUrl,
      width: 200,
      height: 200,
      colorDark: "#1a1a2e",
      colorLight: "#ffffff",
      correctLevel: QRCode.CorrectLevel.H
    });
  </script>

</body>
</html>
